program = "../python.thue"
timeout = 30

[[case]]
name = "function with a body"
input = "def f():\n    pass\n"

[case.expect]
exit_code = 0
stdout = "Module(body=[FunctionDef(name='f', args=arguments(posonlyargs=[], args=[], kwonlyargs=[], kw_defaults=[], defaults=[]), body=[Pass()], decorator_list=[], type_params=[])], type_ignores=[])\n"
stderr = ""

[[case]]
name = "function parameters"
input = "def f(a, b):\n    return\n"

[case.expect]
exit_code = 0
stdout = "Module(body=[FunctionDef(name='f', args=arguments(posonlyargs=[], args=[arg(arg='a'), arg(arg='b')], kwonlyargs=[], kw_defaults=[], defaults=[]), body=[Return()], decorator_list=[], type_params=[])], type_ignores=[])\n"
stderr = ""

[[case]]
name = "trailing comma parameter"
input = "def f(a,):\n    pass\n"

[case.expect]
exit_code = 0
stdout = "Module(body=[FunctionDef(name='f', args=arguments(posonlyargs=[], args=[arg(arg='a')], kwonlyargs=[], kw_defaults=[], defaults=[]), body=[Pass()], decorator_list=[], type_params=[])], type_ignores=[])\n"
stderr = ""

[[case]]
name = "return a value"
input = "def f():\n    return 1\n"

[case.expect]
exit_code = 0
stdout = "Module(body=[FunctionDef(name='f', args=arguments(posonlyargs=[], args=[], kwonlyargs=[], kw_defaults=[], defaults=[]), body=[Return(value=Constant(value=1))], decorator_list=[], type_params=[])], type_ignores=[])\n"
stderr = ""

[[case]]
name = "return an expression"
input = "def f():\n    return 1 + 2\n"

[case.expect]
exit_code = 0
stdout = "Module(body=[FunctionDef(name='f', args=arguments(posonlyargs=[], args=[], kwonlyargs=[], kw_defaults=[], defaults=[]), body=[Return(value=BinOp(left=Constant(value=1), op=Add(), right=Constant(value=2)))], decorator_list=[], type_params=[])], type_ignores=[])\n"
stderr = ""

[[case]]
name = "bare return"
input = "return"

[case.expect]
exit_code = 0
stdout = "Module(body=[Return()], type_ignores=[])\n"
stderr = ""

[[case]]
name = "return a value at module level"
input = "return 1"

[case.expect]
exit_code = 0
stdout = "Module(body=[Return(value=Constant(value=1))], type_ignores=[])\n"
stderr = ""

