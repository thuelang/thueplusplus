program = "../python.thue"
timeout = 30

[[case]]
name = "addition"
input = "1+2"

[case.expect]
exit_code = 0
stdout = "Module(body=[Expr(value=BinOp(left=Constant(value=1), op=Add(), right=Constant(value=2)))], type_ignores=[])\n"
stderr = ""

[[case]]
name = "grouped product"
input = "(a+b)*c"

[case.expect]
exit_code = 0
stdout = "Module(body=[Expr(value=BinOp(left=BinOp(left=Name(id='a', ctx=Load()), op=Add(), right=Name(id='b', ctx=Load())), op=Mult(), right=Name(id='c', ctx=Load())))], type_ignores=[])\n"
stderr = ""

[[case]]
name = "double quoted string"
input = "\"hi\""

[case.expect]
exit_code = 0
stdout = "Module(body=[Expr(value=Constant(value=\"hi\"))], type_ignores=[])\n"
stderr = ""

[[case]]
name = "single quoted string"
input = "'ab'"

[case.expect]
exit_code = 0
stdout = "Module(body=[Expr(value=Constant(value=\"ab\"))], type_ignores=[])\n"
stderr = ""

[[case]]
name = "bare name"
input = "a"

[case.expect]
exit_code = 0
stdout = "Module(body=[Expr(value=Name(id='a', ctx=Load()))], type_ignores=[])\n"
stderr = ""

[[case]]
name = "keyword is unsupported"
input = "def"

[case.expect]
exit_code = 2
stdout = ""
stderr = "unsupported_form\n"

[[case]]
name = "division is not evaluated"
input = "1/0"

[case.expect]
exit_code = 0
stdout = "Module(body=[Expr(value=BinOp(left=Constant(value=1), op=Div(), right=Constant(value=0)))], type_ignores=[])\n"
stderr = ""

