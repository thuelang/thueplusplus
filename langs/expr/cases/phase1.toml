[case.bindings.lines]
expr = "split(\"a\", \"\\n\")[1]"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: bad index"

[[case]]
name = "296 unknown function"

[case.bindings.lines]
expr = "foo(1)"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: unknown function foo"

[[case]]
name = "297 hash outside"

[case.bindings.lines]
expr = "#"

[case.expect]
exit_code = 2
stdout = ""
stderr = "syntax_error: '#' outside a predicate"

[[case]]
name = "298 acc outside"

[case.bindings.lines]
expr = "#acc"

[case.expect]
exit_code = 2
stdout = ""
stderr = "syntax_error: '#acc' outside a predicate"

[[case]]
name = "299 empty separator"

[case.bindings.lines]
expr = "split(\"a\", \"\")"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: empty separator"

[[case]]
name = "300 wrong arity"

[case.bindings.lines]
expr = "map(1)"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: wrong arity"

[[case]]
name = "301 cannot print array"

[case.bindings.lines]
expr = "1..3"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: cannot print array"

[[case]]
name = "302 range needs integers"

[case.bindings.lines]
expr = "\"a\"..\"b\""

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: range needs integers"

[[case]]
name = "303 cannot convert string"

[case.bindings.lines]
expr = "int(\"no\")"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: cannot convert string"

[[case]]
name = "304 cannot convert value"

[case.bindings.lines]
expr = "int(true)"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: cannot convert value"

[[case]]
name = "305 cannot join"

[case.bindings.lines]
expr = "join(1..3, \",\")"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: cannot join that"

[[case]]
name = "306 cannot map"

[case.bindings.lines]
expr = "map(1, #)"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: cannot map that"

[[case]]
name = "307 cannot reduce"

[case.bindings.lines]
expr = "reduce(1, # + #acc, 0)"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: cannot reduce that"

[[case]]
name = "308 cannot split"

[case.bindings.lines]
expr = "split(1, \"a\")"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: cannot split that"

[[case]]
name = "309 string rational"

[case.bindings.lines]
expr = "string(1/2)"

[case.expect]
exit_code = 2
stdout = ""
stderr = "type_error: cannot convert value"

[[case]]
name = "310 stdin let"

[case.bindings.lines]
expr = "let n = int(stdin); n"
env = "{\"stdin\":\"5\"}"

[case.expect]
exit_code = 0
stdout = "5\n"
stderr = ""

[[case]]
name = "311 input string"
input = "\"Hello\""

[case.expect]
exit_code = 0
stdout = "Hello\n"
stderr = ""

[[case]]
name = "312 input let"
input = "let n = 2; n"

[case.expect]
exit_code = 0
stdout = "2\n"
stderr = ""

[[case]]
name = "313 ternary group"

[case.bindings.lines]
expr = "true ? 1 : (2)"

[case.expect]
exit_code = 0
stdout = "1\n"
stderr = ""

[[case]]
name = "314 join empty sep"

[case.bindings.lines]
expr = "join(split(\"a\", \"b\"), \"\")"

[case.expect]
exit_code = 0
stdout = "a\n"
stderr = ""

[[case]]
name = "315 string escapes"

[case.bindings.lines]
expr = "\"\\\"\\\\\\/\\b\\f\\n\\r\\t\\u0067\\u007F\\u000A\\u000B\\u000C\\u000D\\u000E\\u000F\\u0010\\u0041\""

[case.expect]
exit_code = 0
# The case runner reads stdout as text, so a carriage return is compared as a line feed.
stdout = "\"\\/\u0008\u000c\n\n\tg\u007f\n\u000b\u000c\n\u000e\u000f\u0010A\n"
stderr = ""

[[case]]
name = "316 unicode too big"

[case.bindings.lines]
expr = "\"\\u0080\""

[case.expect]
exit_code = 2
stdout = ""
stderr = "syntax_error: bad string escape"

[[case]]
name = "317 acc prefix"

[case.bindings.lines]
expr = "#accX"

[case.expect]
exit_code = 2
stdout = ""
stderr = "syntax_error: unexpected token"

[[case]]
name = "318 index bool"

[case.bindings.lines]
expr = "map(1..1, # == 1)[0]"

[case.expect]
exit_code = 0
stdout = "true\n"
stderr = ""

[[case]]
name = "319 index false"

[case.bindings.lines]
expr = "map(1..1, # == 2)[0]"

[case.expect]
exit_code = 0
stdout = "false\n"
stderr = ""

[[case]]
name = "320 index int"

[case.bindings.lines]
expr = "map(1..3, #)[1]"

[case.expect]
exit_code = 0
stdout = "2\n"
stderr = ""

[[case]]
name = "321 empty join"

[case.bindings.lines]
expr = "join(1..0, \",\")"

[case.expect]
exit_code = 0
stdout = "\n"
stderr = ""

[[case]]
name = "322 reduce strings"

[case.bindings.lines]
expr = "reduce(split(\"ab\", \"b\"), # + #acc, \"\")"

[case.expect]
exit_code = 0
stdout = "a\n"
stderr = ""

[[case]]
name = "323 reduce bool"

[case.bindings.lines]
expr = "reduce(1..2, # == 1 && #acc, true)"

[case.expect]
exit_code = 0
stdout = "false\n"
stderr = ""

[[case]]
name = "324 let group"

[case.bindings.lines]
expr = "let n = (1 + 2); n"

[case.expect]
exit_code = 0
stdout = "3\n"
stderr = ""

[[case]]
name = "325 let missing"

[case.bindings.lines]
expr = "let n = (1; n"

[case.expect]
exit_code = 2
stdout = ""
stderr = "syntax_error: missing value"

[[case]]
name = "326 let unexpected paren"

[case.bindings.lines]
expr = "let n = ); n"

[case.expect]
exit_code = 2
stdout = ""
stderr = "syntax_error: unexpected ')'"

[[case]]
name = "327 name index"

[case.bindings.lines]
expr = "let xs = split(\"ab\", \"b\"); xs[0]"

[case.expect]
exit_code = 0
stdout = "a\n"
stderr = ""

[[case]]
name = "328 input newline"
input = "let n = 1;\nn"

[case.expect]
exit_code = 0
stdout = "1\n"
stderr = ""

[[case]]
name = "329 input return"
input = "let n = 1;\rn"

[case.expect]
exit_code = 0
stdout = "1\n"
stderr = ""

[[case]]
name = "330 map bool join"

[case.bindings.lines]
expr = "join(map(1..2, string(# == 1)), \",\")"

[case.expect]
exit_code = 0
stdout = "true,false\n"
stderr = ""
