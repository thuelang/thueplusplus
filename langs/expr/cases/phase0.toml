program = "../expr.thue"
timeout = 60
args = ["--max-evals", "2000000", "--max-steps", "2000000"]

[[case]]
name = "001 1"

[case.bindings.lines]
expr = "1"

[case.expect]
exit_code = 0
stdout = "1\n"
stderr = ""

[[case]]
name = "002 1-2"

[case.bindings.lines]
expr = "1+2"

[case.expect]
exit_code = 0
stdout = "3\n"
stderr = ""

[[case]]
name = "003 1-2-3"

[case.bindings.lines]
expr = "1+2*3"

[case.expect]
exit_code = 0
stdout = "7\n"
stderr = ""

[[case]]
name = "004 1-2-3"

[case.bindings.lines]
expr = "(1+2)*3"

[case.expect]
exit_code = 0
stdout = "9\n"
stderr = ""

[[case]]
name = "005 1"

[case.bindings.lines]
expr = "((1))"

[case.expect]
exit_code = 0
stdout = "1\n"
stderr = ""

[[case]]
name = "006 1-2-3"

[case.bindings.lines]
expr = "1+2+3"

[case.expect]
exit_code = 0
stdout = "6\n"
stderr = ""

